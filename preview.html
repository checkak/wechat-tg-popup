<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TG 弹窗 · 参数预览</title>
<style>
  :root{
    /* 全部来自视频逐帧量测 */
    --drop: -36px;          /* 入场位移 */
    --scale0: 0.72;         /* 入场缩放 */
    --dur: 0.52s;           /* 弹簧时长 */
    --overshoot: 9.7px;     /* 实测过冲 */
    --hold: 3.6s;           /* 停留 */
    --exit: 0.16s;          /* 收起 */
    --card-h: 64px;
    --card-r: 20px;
    --inset: 15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;background:#f2f2f7;
    font:15px/1.45 -apple-system,"PingFang SC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:0 0 40px;
  }
  .phone{
    position:relative;width:min(430px,100vw);height:330px;overflow:hidden;
    background:linear-gradient(180deg,#fbfbfd,#f2f2f7);
  }
  .island{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:96px;height:26px;border-radius:14px;background:#111;
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:absolute;left:var(--inset);right:var(--inset);top:60px;
    height:var(--card-h);border-radius:var(--card-r);
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    box-shadow:0 8px 16px rgba(0,0,0,.16);
    display:flex;align-items:center;gap:10px;padding:0 12px;
    transform:translateY(var(--drop)) scale(var(--scale0));
    opacity:0;will-change:transform,opacity;
  }
  .card.play{ animation: dropIn var(--dur) cubic-bezier(.22,1.25,.36,1) forwards; }
  .card.out{ animation: liftOut var(--exit) ease-in forwards; }

  @keyframes dropIn{
    0%   { transform:translateY(var(--drop)) scale(var(--scale0)); opacity:0; }
    10%  { opacity:1; }
    /* 过冲：实测峰值出现在 ~170ms（占时长 33%），幅度 27% 行程 */
    33%  { transform:translateY(var(--overshoot)) scale(1.015); }
    62%  { transform:translateY(-2px) scale(.995); }
    82%  { transform:translateY(1px) scale(1.002); }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes liftOut{
    to { transform:translateY(-22px) scale(.94); opacity:0; }
  }

  /* 果冻：内容两轴反相压扁 */
  .inner{display:flex;align-items:center;gap:10px;width:100%}
  .card.play .inner{ animation: jelly .42s ease-out both; }
  @keyframes jelly{
    0%{transform:scale(1,1)}
    22%{transform:scale(1.042,.94)}
    52%{transform:scale(.979,1.036)}
    78%{transform:scale(1.006,.988)}
    100%{transform:scale(1,1)}
  }

  .avatar{
    width:40px;height:40px;border-radius:10px;flex:0 0 40px;
    background:linear-gradient(135deg,#7a5cff,#ff6ba8);
    color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;
    font-size:17px;
  }
  .txt{min-width:0;flex:1}
  .name{font-weight:600;font-size:15px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .body{font-size:13.5px;color:#8a8a8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{position:absolute;right:12px;top:8px;font-size:9.5px;color:#c2c2c7}

  /* ---------- 控制面板 ---------- */
  .panel{width:min(430px,100vw);padding:14px 16px;background:#fff;border-radius:16px 16px 0 0;
         box-shadow:0 -2px 20px rgba(0,0,0,.06);margin-top:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:#444}
  .row label{width:96px;flex:0 0 96px;color:#666}
  .row input[type=range]{flex:1}
  .row .val{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:#111;font-weight:600}
  button{border:0;border-radius:10px;background:#0a84ff;color:#fff;font:inherit;
         font-weight:600;padding:10px 16px;width:100%}
  .hint{font-size:11.5px;color:#8e8e93;line-height:1.6;margin-top:8px}
  code{background:#f2f2f7;border-radius:4px;padding:1px 4px;font-size:11px}
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="card" id="card">
      <div class="inner">
        <div class="avatar">J</div>
        <div class="txt">
          <div class="name" id="name">JockX</div>
          <div class="body" id="body">在吗？刚看到你发的链接</div>
        </div>
      </div>
      <div class="tag">微信</div>
    </div>
  </div>

  <div class="panel">
    <div class="row"><label>阻尼 ζ</label>
      <input type="range" id="damp" min="0.2" max="0.9" step="0.01" value="0.38">
      <span class="val" id="dampV">0.38</span></div>
    <div class="row"><label>时长</label>
      <input type="range" id="dur" min="0.2" max="1.0" step="0.02" value="0.52">
      <span class="val" id="durV">0.52s</span></div>
    <div class="row"><label>落下距离</label>
      <input type="range" id="drop" min="-80" max="-10" step="2" value="-36">
      <span class="val" id="dropV">-36px</span></div>
    <div class="row"><label>起始缩放</label>
      <input type="range" id="sc" min="0.6" max="1" step="0.02" value="0.72">
      <span class="val" id="scV">0.72</span></div>
    <button id="play">播放一次</button>
    <div class="hint">
      默认值就是视频实测值（ζ=0.38 → 过冲 27%、峰值 170ms、稳定 600ms）。<br>
      想更「果冻」把 ζ 拉到 <code>0.28</code>；想更像系统通知拉到 <code>0.60</code>。<br>
      改好的数字直接填进 <code>com.wctg.popup.plist</code> 即可，不用重编译 dylib。
    </div>
  </div>

<script>
const card = document.getElementById('card');
const root = document.documentElement;
const bind = (id, suffix, apply) => {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'V');
  const sync = () => {
    out.textContent = el.value + suffix;
    apply(el.value);
  };
  el.addEventListener('input', sync);
  sync();
};

// ζ 与「过冲 → 关键帧比例」的换算：M = exp(-ζπ/√(1-ζ²))
function overshootFor(zeta) {
  const m = Math.exp(-zeta * Math.PI / Math.sqrt(1 - zeta * zeta));
  return Math.min(1.6, m * 1.0);          // 用于 CSS 关键帧的缩放/位移放大系数
}

let zeta = 0.38;
bind('damp', '', v => { zeta = +v; applyZeta(); });
bind('dur', 's', v => { root.style.setProperty('--dur', v + 's'); });
bind('drop', 'px', v => { root.style.setProperty('--drop', v + 'px'); });
bind('sc', '', v => { root.style.setProperty('--scale0', v); });

function applyZeta() {
  // 过冲 = 行程 × M，M = exp(-ζπ/√(1-ζ²))
  // ζ=0.38 → M≈0.27 → 36×0.27 ≈ 9.7px，与视频实测一致
  const m = overshootFor(zeta);
  const drop = parseFloat(getComputedStyle(root).getPropertyValue('--drop')) || -36;
  const kick = Math.abs(drop) * m;
  root.style.setProperty('--overshoot', kick.toFixed(1) + 'px');
  root.style.setProperty('--kick-scale', (1 + Math.min(0.05, m * 0.19)).toFixed(3));
}

document.getElementById('play').onclick = () => {
  card.classList.remove('play', 'out');
  void card.offsetWidth;                 // 强制重排以重启动画
  card.classList.add('play');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => {
    card.classList.remove('play');
    card.classList.add('out');
  }, 3600);
};

// 进来先播一次
document.getElementById('play').click();
</script>
</body>
</html>
